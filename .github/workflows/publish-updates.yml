name: Publish signed resource update
on:
  push:
    branches: [main]
    paths:
      - 'publisher/**'
      - '.github/workflows/publish-updates.yml'
permissions:
  contents: write
concurrency:
  group: rabbit-float-release-publisher
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      GH_COMMIT: ${{ github.sha }}
    steps:
      - name: Run publisher from the exact triggering commit
        shell: python
        run: |
          import os, urllib.request, urllib.error, subprocess, tempfile, pathlib
          repo = os.environ['GH_REPO']
          assert repo == 'lumicho111/rabbitkeeper-updatededicated'
          url = f"https://api.github.com/repos/{repo}/contents/publisher/publish.py?ref={os.environ['GH_COMMIT']}"
          request = urllib.request.Request(url, headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'], 'Accept':'application/vnd.github.raw+json', 'X-GitHub-Api-Version':'2022-11-28'})
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  source = response.read(131072)
          except urllib.error.HTTPError as error:
              if error.code == 404:
                  print('Publisher bootstrap installed. No request submitted yet.')
                  raise SystemExit(0)
              raise
          with tempfile.TemporaryDirectory() as folder:
              script = pathlib.Path(folder)/'publish.py'
              script.write_bytes(source)
              subprocess.run(['python3',str(script)],check=True)

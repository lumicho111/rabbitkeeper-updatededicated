name: Publish verified signed resource041 from current full source
on:
  push:
    branches: [main]
    paths: ['.github/workflows/041-direct-publish.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TEMP_RESOURCE_EXPORT: 'https://sdmntprsoutheastus3.oaiusercontent.com/files/00000000-a88c-820c-a35d-de590e0d5892/raw?se=2026-11-11T10%3A48%3A12Z&sp=r&sv=2026-06-06&sr=b&scid=5f3943e2-8708-59bb-bdbe-964eac709234&skoid=27fbae2c-124f-4566-a0d8-1b07a5a41c53&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-11T02%3A29%3A31Z&ske=2026-11-12T02%3A29%3A31Z&sks=b&skv=2026-06-06&sig=ClnV1QNJhhW6ppAtoKpDItWuPsfW/m5L%2B3Ul8KzC/YA%3D'
    steps:
      - uses: actions/checkout@v4
      - name: Fetch published-resource export (no full/private source)
        run: |
          curl -fsSL --max-time 120 --retry 2 "$TEMP_RESOURCE_EXPORT" -o /tmp/resource041-export.zip
          unzip -j -o /tmp/resource041-export.zip rabbit-float-build15-resource-041.zip -d /tmp
          test -s /tmp/rabbit-float-build15-resource-041.zip
      - name: Verify signed 041 manifest and every changed asset with original public key
        run: |
          python3 - <<'PY'
          import hashlib,json,subprocess,zipfile
          from pathlib import Path
          p=Path('/tmp/rabbit-float-build15-resource-041.zip')
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              raw=z.read('manifest.json');signature=z.read('manifest.sig')
              assert hashlib.sha256(raw).hexdigest()=='b960ede98790518ddb0580b75250c20bf1ee49c49fc2a907c6ed59a5e5f25d37'
              manifest=json.loads(raw)
              assert manifest['resourceId']=='rabbit-resource-041'
              assert manifest['sequence']==41 and manifest['nativeBuild']==15
              assert manifest['appId']=='app.ii.phone'
              Path('/tmp/m041.json').write_bytes(raw)
              Path('/tmp/s041.sig').write_bytes(signature)
              subprocess.run(['openssl','dgst','-sha256','-verify','publisher/public-key.pem',
                  '-signature','/tmp/s041.sig','/tmp/m041.json'],check=True)
              count=0
              for name in z.namelist():
                  if name.startswith('www/'):
                      assert hashlib.sha256(z.read(name)).hexdigest()==manifest['files'][name[4:]],name
                      count+=1
              assert count>=3
              print('Verified resource041 archive, signature and',count,'assets')
          PY
      - name: Publish latest Android pull update resource041
        run: |
          if gh release view resource-041 --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "041 already exists; refusing to overwrite"
            exit 1
          fi
          gh release create resource-041 /tmp/rabbit-float-build15-resource-041.zip             --repo "$GH_REPO"             --title "资源更新041 · 通话菜单与挂断按钮"             --notes "Android 1.0.13 / native build15 累计资源更新。Chat 视频与 Phone 的长按操作改为复用普通 Chat 原生菜单组件；修复单人与群语音通话挂断按钮的状态布局与居中。保留040既有功能，不需要重新安装 APK。"             --latest

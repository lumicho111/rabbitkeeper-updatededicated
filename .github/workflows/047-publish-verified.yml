name: Publish verified cumulative resource047
on:
  push:
    branches: [main]
    paths: ['.github/workflows/047-publish-verified.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TEMP_SIGNED_EXPORT: 'https://sdmntprwestus.oaiusercontent.com/files/00000000-75dc-8230-b192-dc65c244ba3f/raw?se=2026-11-11T12%3A20%3A08Z&sp=r&sv=2026-06-06&sr=b&scid=951ab974-7c03-5beb-8a6e-9c0f18fab4a4&skoid=27fbae2c-124f-4566-a0d8-1b07a5a41c53&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-11T06%3A59%3A18Z&ske=2026-11-12T06%3A59%3A18Z&sks=b&skv=2026-06-06&sig=bmSjCQ32DgAPfrB3GYhHHHKyKJM%2BkhKljBGXSIJOarc%3D'
    steps:
      - uses: actions/checkout@v4
      - name: Download preverified signed resource artifact
        run: |
          curl -fsSL --max-time 120 --retry 3 "$TEMP_SIGNED_EXPORT" -o /tmp/047-artifact.zip
          unzip -p /tmp/047-artifact.zip rabbit-float-build15-resource-047.zip > /tmp/rabbit-float-build15-resource-047.zip
          test -s /tmp/rabbit-float-build15-resource-047.zip
      - name: Verify approved signature, version, baseline and each changed asset
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,zipfile,subprocess
          path=Path('/tmp/rabbit-float-build15-resource-047.zip')
          with zipfile.ZipFile(path) as z:
              assert z.testzip() is None
              raw=z.read('manifest.json');signature=z.read('manifest.sig')
              assert hashlib.sha256(raw).hexdigest()=='f5671673353f620898a1194fe9ca2d432a1be5e1ee8703bad4c411b153db5408'
              obj=json.loads(raw)
              assert obj['sequence']==47 and obj['resourceId']=='rabbit-resource-047'
              assert obj['nativeBuild']==15 and obj['appId']=='app.ii.phone'
              assert obj['baseDigest']=='2f0f0e8870fbb1f9732ea7197c11a811a71adeb66225de28b62aba6ccfe662ad'
              Path('/tmp/047-manifest').write_bytes(raw)
              Path('/tmp/047-signature').write_bytes(signature)
              subprocess.run(['openssl','dgst','-sha256','-verify','publisher/public-key.pem','-signature','/tmp/047-signature','/tmp/047-manifest'],check=True)
              changed=[name for name in z.namelist() if name.startswith('www/')]
              assert len(changed)>=3
              for name in changed:assert hashlib.sha256(z.read(name)).hexdigest()==obj['files'][name[4:]],name
              print('Verified signed cumulative 047:',len(changed),'assets')
          PY
      - name: Publish final pull update, never overwrite existing tag
        run: |
          if gh release view resource-047 --repo "$GH_REPO" >/dev/null 2>&1; then
            echo 'Release resource-047 already exists; refusing to overwrite.'
            exit 1
          fi
          gh release create resource-047 /tmp/rabbit-float-build15-resource-047.zip \
            --repo "$GH_REPO" \
            --title '资源更新047 · 通话小窗与直播返回修复' \
            --notes 'Android 1.0.13 / Build 15 正式累计资源更新。合并已验证的 042–046 修复：Chat 单聊/群聊语音视频通话手势返回与悬浮小窗、YouTube/Weverse 直播手势返回确认与后台播放、视频通话结束挂断键、窄竖排台词菜单、夜间视频输入栏和上传视频按钮配色。保留041及此前所有功能。旧 APK 用户可直接在应用内拉取最新资源，无须逐个安装测试 ZIP 或重新安装 APK。Phone 电话不新增小窗。' \
            --latest
